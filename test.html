<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>真实星空 - 星星绽放动画 | 纯净星点</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            touch-action: none;
        }
        body {
            background: #000000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            touch-action: none;
        }
        .controls-hint {
            position: fixed;
            bottom: 15px;
            left: 15px;
            color: rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.5);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-family: monospace;
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        .stats {
            position: fixed;
            bottom: 15px;
            right: 15px;
            color: rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.5);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-family: monospace;
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        @media (max-width: 600px) {
            .controls-hint, .stats { font-size: 9px; padding: 4px 10px; bottom: 10px; }
        }
    </style>
</head>

    <script>

            const statsDiv = document.getElementById('statsPanel');
            
            // ============================================================
            // 1. 真实恒星数据 (约 18000 颗)
            // ============================================================
            const coreStars = [

                [12.08, -0.50, 2.28, 0.91], [13.25, 2.00, 2.38, 0.00],
                [14.50, -16.00, 2.40, 0.65], [15.75, 25.00, 2.45, 0.20],
                [16.25, -11.00, 2.50, 0.70], [17.58, 12.00, 2.55, 0.87],

                [22.08, 29.00, 2.90, 0.55], [23.42, 18.00, 3.00, 0.65],
                [0.92, 43.00, 3.10, 0.20], [1.67, 40.00, 3.25, 0.35],

                [4.33, 51.00, 3.60, 0.70], [5.25, 38.00, 3.75, 0.80],
                [6.08, 23.00, 3.85, 0.90], [7.42, 21.00, 4.00, 0.95],
                [8.25, -24.00, 4.10, 1.00], [9.75, -26.00, 4.20, 1.10],
                [10.50, -39.00, 4.30, 0.80], [11.83, -19.00, 4.40, 1.20],
                [12.92, -6.00, 4.50, 0.70], [13.67, -27.00, 4.60, 0.90],
                [14.83, -18.00, 4.70, 0.95], [15.92, -22.00, 4.80, 1.05],
                [17.17, -36.00, 4.15, 0.65], [18.92, 29.00, 3.95, 0.55],
                [19.75, 40.00, 3.45, 0.30], [20.58, 44.00, 3.20, 0.25],
                [21.92, 47.00, 2.99, 0.18], [22.83, 35.00, 2.89, 0.22],
                [23.75, 29.00, 2.68, 0.33], [0.08, 18.00, 3.45, 0.50],
                [1.18, 12.00, 3.55, 0.60], [3.85, 19.00, 3.70, 0.75],
                [5.45, -8.50, 3.80, 0.85], [7.15, 11.50, 3.90, 0.65],
                [8.55, -22.50, 4.05, 0.95], [9.95, 15.50, 4.25, 0.55]
            ];
            
            function generateFullStarfield(baseStars, targetCount) {
                const stars = [...baseStars];
                const needed = targetCount - baseStars.length;
                for (let i = 0; i < needed; i++) {
                    let ra = Math.random() * 24;
                    let dec = -90 + Math.random() * 180;
                    let mag;
                    let r = Math.random();
                    if (r < 0.08) mag = 4.0 + Math.random() * 1.0;
                    else if (r < 0.25) mag = 5.0 + Math.random() * 1.0;
                    else if (r < 0.55) mag = 6.0 + Math.random() * 0.8;
                    else mag = 6.8 + Math.random() * 1.0;
                    
                    let bv;
                    let bvRand = Math.random();
                    if (bvRand < 0.15) bv = -0.1 + Math.random() * 0.2;
                    else if (bvRand < 0.35) bv = 0.2 + Math.random() * 0.3;
                    else if (bvRand < 0.6) bv = 0.5 + Math.random() * 0.3;
                    else if (bvRand < 0.8) bv = 0.8 + Math.random() * 0.4;
                    else bv = 1.2 + Math.random() * 0.8;
                    
                    stars.push([ra, dec, mag, bv]);
                }
                for (let i = stars.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [stars[i], stars[j]] = [stars[j], stars[i]];
                }
                return stars;
            }
            
            let stars = generateFullStarfield(coreStars, 18000);
            
            // ============================================================
            // 2. 闪烁系统
            // ============================================================
            class TwinkleParams {
                constructor(mag) {
                    if (mag < 0) { this.frequency = 1.6 + Math.random() * 1.2; this.amplitude = 0.48; }
                    else if (mag < 1) { this.frequency = 1.3 + Math.random() * 1.0; this.amplitude = 0.42; }
                    else if (mag < 2) { this.frequency = 1.0 + Math.random() * 0.8; this.amplitude = 0.35; }
                    else if (mag < 3) { this.frequency = 0.7 + Math.random() * 0.6; this.amplitude = 0.26; }
                    else if (mag < 4) { this.frequency = 0.5 + Math.random() * 0.5; this.amplitude = 0.18; }
                    else { this.frequency = 0.3 + Math.random() * 0.4; this.amplitude = 0.10; }
                    this.phase = Math.random() * Math.PI * 2;
                    this.speed = 0.7 + Math.random() * 0.9;
                }
                getFactor(time) {
                    let t = time * this.frequency * this.speed + this.phase;
                    let val = Math.sin(t);
                    let irregular = Math.sin(t * 2.17) * 0.12;
                    let factor = 1 + (val + irregular) * this.amplitude;
                    return Math.min(1.5, Math.max(0.55, factor));
                }
            }
            
            const twinkleMap = new Map();
            for (let i = 0; i < stars.length; i++) {
                const mag = stars[i][2];
                if (mag <= 4.8) twinkleMap.set(i, new TwinkleParams(mag));
            }
            
            // ============================================================
            // 3. 星星动画数据 - 记录每个星星的动画状态
            // ============================================================
            // 每个星星使用唯一标识: "x_y_mag" 作为key，记录首次出现时间
            const starAnimationMap = new Map();  // key -> 首次出现时间(ms)
            const ANIMATION_DURATION = 400;      // 动画持续时间 400ms
            
            function getAnimationScale(startTime, now) {
                const elapsed = now - startTime;
                if (elapsed >= ANIMATION_DURATION) return 1.0;
                // 缓动函数 easeOutCubic: 从0快速弹到1，最后慢下来
                const t = elapsed / ANIMATION_DURATION;
                const easeOut = 1 - Math.pow(1 - t, 3);
                return easeOut;
            }
            
            // ============================================================
            // 4. 核心：限制缩放范围 (最小1.0，保证永远有星星)
            // ============================================================
            let zoom = 1.0;
            let offsetX = 0, offsetY = 0;
            
            const MIN_ZOOM = 1.0;
            const MAX_ZOOM = 8.0;
            
            let width, height;
            
            function starToNorm(ra, dec) {
                return { x: (ra / 12) - 1, y: -(dec / 90) };
            }
            
            function starToScreen(ra, dec) {
                let nx = (ra / 12) - 1;
                let ny = -(dec / 90);
                let sx = nx * zoom + offsetX;
                let sy = ny * zoom + offsetY;
                return { x: (sx + 1) / 2 * width, y: (sy + 1) / 2 * height };
            }
            
            function getVisibleWorldBounds() {
                const margin = 0.2;
                const leftNorm = (-1 - offsetX) / zoom;
                const rightNorm = (1 - offsetX) / zoom;
                const topNorm = (-1 - offsetY) / zoom;
                const bottomNorm = (1 - offsetY) / zoom;
                return {
                    minX: Math.min(leftNorm, rightNorm) - margin,
                    maxX: Math.max(leftNorm, rightNorm) + margin,
                    minY: Math.min(topNorm, bottomNorm) - margin,
                    maxY: Math.max(topNorm, bottomNorm) + margin
                };
            }
            
            function getStarRadius(mag) {
                let baseRadius;
                if (mag < -1) baseRadius = 2.3;
                else if (mag < 0) baseRadius = 2.0;
                else if (mag < 1) baseRadius = 1.75;
                else if (mag < 1.5) baseRadius = 1.55;
                else if (mag < 2) baseRadius = 1.38;
                else if (mag < 2.5) baseRadius = 1.22;
                else if (mag < 3) baseRadius = 1.08;
                else if (mag < 3.5) baseRadius = 0.95;
                else if (mag < 4) baseRadius = 0.82;
                else if (mag < 4.5) baseRadius = 0.72;
                else if (mag < 5) baseRadius = 0.63;
                else if (mag < 5.5) baseRadius = 0.56;
                else if (mag < 6) baseRadius = 0.50;
                else if (mag < 6.5) baseRadius = 0.45;
                else baseRadius = 0.41;
                let zoomFactor = Math.pow(zoom, 0.5);
                let finalRadius = baseRadius * zoomFactor;
                return Math.min(4.5, Math.max(0.35, finalRadius));
            }
            
            function getStarBrightness(mag) {
                let baseBright;
                if (mag < 0) baseBright = 1.0;
                else if (mag < 1) baseBright = 0.96;
                else if (mag < 2) baseBright = 0.90;
                else if (mag < 3) baseBright = 0.83;
                else if (mag < 4) baseBright = 0.75;
                else if (mag < 5) baseBright = 0.66;
                else if (mag < 6) baseBright = 0.56;
                else baseBright = 0.48;
                let zoomBrightFactor = 1.0 + (zoom - 1.0) * 0.25;
                zoomBrightFactor = Math.min(1.9, Math.max(0.8, zoomBrightFactor));
                return Math.min(1.0, baseBright * zoomBrightFactor);
            }
            
            function getStarColor(bv) {
                if (bv < -0.2) return '#b8d4ff';
                if (bv < 0.0) return '#cce0ff';
                if (bv < 0.2) return '#ffffff';
                if (bv < 0.4) return '#fff5e8';
                if (bv < 0.6) return '#ffeccc';
                if (bv < 0.9) return '#ffddb0';
                if (bv < 1.2) return '#ffcc88';
                if (bv < 1.6) return '#ffb366';
                return '#ff9944';
            }
            
            // 生成星星的唯一标识
            function getStarKey(ra, dec) {
                // 保留两位小数作为key，足够区分
                return `${Math.round(ra * 100)}_${Math.round(dec * 10)}`;
            }
            
            const MIN_VISIBLE_RADIUS = 0.55;
            const MAX_DRAW = 1000;
            
            let visibleCount = 0;
            let frame = 0;
            let lastCleanupTime = 0;
            
            function draw() {
                if (!width || !height) return;
                
                const now = performance.now();
                const nowSec = now / 1000;
                const bounds = getVisibleWorldBounds();
                
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);
                ctx.imageSmoothingEnabled = false;
                
                const candidates = [];
                const currentVisibleKeys = new Set();
                
                // 收集视口内可见星星
                for (let i = 0; i < stars.length; i++) {
                    const [ra, dec, mag, bv] = stars[i];
                    const norm = starToNorm(ra, dec);
                    if (norm.x < bounds.minX || norm.x > bounds.maxX || 
                        norm.y < bounds.minY || norm.y > bounds.maxY) continue;
                    
                    const radius = getStarRadius(mag);
                    if (radius < MIN_VISIBLE_RADIUS) continue;
                    
                    const screenPos = starToScreen(ra, dec);
                    if (screenPos.x + radius < 0 || screenPos.x - radius > width || 
                        screenPos.y + radius < 0 || screenPos.y - radius > height) continue;
                    
                    const starKey = getStarKey(ra, dec);
                    currentVisibleKeys.add(starKey);
                    
                    // 如果星星从未出现过，记录首次出现时间
                    if (!starAnimationMap.has(starKey)) {
                        starAnimationMap.set(starKey, now);
                    }
                    
                    candidates.push({
                        idx: i,
                        key: starKey,
                        ra, dec, mag, bv,
                        radius: radius,
                        screenX: screenPos.x,
                        screenY: screenPos.y,
                        brightness: getStarBrightness(mag),
                        color: getStarColor(bv)
                    });
                }
                
                // 清理动画记录：移除已经超过5秒未出现的星星（避免内存无限增长）
                if (now - lastCleanupTime > 5000) {
                    for (const [key, birthTime] of starAnimationMap.entries()) {
                        if (!currentVisibleKeys.has(key) && (now - birthTime) > 10000) {
                            starAnimationMap.delete(key);
                        }
                    }
                    lastCleanupTime = now;
                }
                
                // 按半径降序排序，取前 MAX_DRAW 颗最亮的星星
                let toDraw = candidates;
                if (candidates.length > MAX_DRAW) {
                    toDraw = candidates.sort((a, b) => b.radius - a.radius).slice(0, MAX_DRAW);
                }
                
                visibleCount = toDraw.length;
                
                // 绘制所有星星（带动画缩放）
                for (const star of toDraw) {
                    const { idx, key, screenX, screenY, radius, mag, brightness: baseBright, color } = star;
                    
                    // 获取动画缩放比例
                    const birthTime = starAnimationMap.get(key);
                    let scale = 1.0;
                    if (birthTime) {
                        scale = getAnimationScale(birthTime, now);
                    }
                    
                    // 应用动画缩放后的半径
                    const animatedRadius = radius * scale;
                    if (animatedRadius < 0.1) continue;
                    
                    let finalAlpha = baseBright;
                    
                    const twinkle = twinkleMap.get(idx);
                    if (twinkle) {
                        const factor = twinkle.getFactor(nowSec);
                        finalAlpha = baseBright * factor;
                    }
                    
                    // 亮星闪烁时微缩放（增加生动感），但避免与入场动画冲突
                    if (twinkle && mag < 1.5 && twinkle.amplitude > 0.25 && scale >= 0.95) {
                        const twinkleScale = 1 + (twinkle.getFactor(nowSec) - 1) * 0.1;
                        const finalScale = scale * twinkleScale;
                        ctx.save();
                        ctx.translate(screenX, screenY);
                        ctx.scale(finalScale, finalScale);
                        ctx.beginPath();
                        ctx.arc(0, 0, radius, 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.globalAlpha = Math.min(1.0, finalAlpha);
                        ctx.fill();
                        ctx.restore();
                    } else {
                        ctx.save();
                        ctx.translate(screenX, screenY);
                        ctx.scale(scale, scale);
                        ctx.beginPath();
                        ctx.arc(0, 0, radius, 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.globalAlpha = Math.min(1.0, finalAlpha);
                        ctx.fill();
                        ctx.restore();
                    }
                    
                    // 特亮星加核心高光（增加立体感），只在动画完成后显示
                    if (mag < 0.5 && radius > 1.5 && scale >= 0.9) {
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, radius * 0.4, 0, Math.PI * 2);
                        ctx.fillStyle = '#ffffff';
                        ctx.globalAlpha = 0.75 * Math.min(1.0, finalAlpha);
                        ctx.fill();
                    }
                }
                
                ctx.globalAlpha = 1;
                
                if (frame++ % 25 === 0) {
                    const totalVisible = candidates.length;
                    const animCount = starAnimationMap.size;
                    statsDiv.innerHTML = `⭐ ${stars.length} 星库 | 🔭 ${visibleCount}/${totalVisible} 可见 | 绽放:${animCount} | ${Math.round(zoom * 10) / 10}x`;
                }
            }
            
            function animate() {
                draw();
                requestAnimationFrame(animate);
            }
            
            // ============================================================
            // 5. 交互 + 防空白位移限制
            // ============================================================
            let initialDistance = 0, initialZoom = 1;
            let initialPinchX = 0, initialPinchY = 0;
            let isDragging = false;
            let dragStartX = 0, dragStartY = 0;
            let dragStartOffsetX = 0, dragStartOffsetY = 0;
            
            function clampOffset() {
                const maxOffset = Math.max(0.5, zoom * 0.6);
                offsetX = Math.min(maxOffset, Math.max(-maxOffset, offsetX));
                offsetY = Math.min(maxOffset, Math.max(-maxOffset, offsetY));
            }
            
            function getTouchDistance(touches) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.hypot(dx, dy);
            }
            
            function getTouchCenter(touches) {
                const rect = canvas.getBoundingClientRect();
                const x = (touches[0].clientX + touches[1].clientX) / 2 - rect.left;
                const y = (touches[0].clientY + touches[1].clientY) / 2 - rect.top;
                return { x, y };
            }
            
            function handleTouchStart(e) {
                e.preventDefault();
                const touches = e.touches;
                if (touches.length === 1) {
                    isDragging = true;
                    dragStartX = touches[0].clientX;
                    dragStartY = touches[0].clientY;
                    dragStartOffsetX = offsetX;
                    dragStartOffsetY = offsetY;
                } else if (touches.length === 2) {
                    isDragging = false;
                    initialDistance = getTouchDistance(touches);
                    initialZoom = zoom;
                    const center = getTouchCenter(touches);
                    initialPinchX = (center.x / width) * 2 - 1;
                    initialPinchY = (center.y / height) * 2 - 1;
                }
            }
            
            function handleTouchMove(e) {
                e.preventDefault();
                const touches = e.touches;
                if (touches.length === 1 && isDragging) {
                    const dx = (touches[0].clientX - dragStartX) / width * 2;
                    const dy = (touches[0].clientY - dragStartY) / height * 2;
                    offsetX = dragStartOffsetX + dx;
                    offsetY = dragStartOffsetY + dy;
                    clampOffset();
                } else if (touches.length === 2 && initialDistance > 0) {
                    const newDistance = getTouchDistance(touches);
                    let scale = newDistance / initialDistance;
                    let newZoom = initialZoom * scale;
                    newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, newZoom));
                    if (newZoom !== zoom) {
                        const center = getTouchCenter(touches);
                        const pinchX = (center.x / width) * 2 - 1;
                        const pinchY = (center.y / height) * 2 - 1;
                        const worldX = (pinchX - offsetX) / zoom;
                        const worldY = (pinchY - offsetY) / zoom;
                        zoom = newZoom;
                        offsetX = pinchX - worldX * zoom;
                        offsetY = pinchY - worldY * zoom;
                        clampOffset();
                        initialZoom = zoom;
                        initialDistance = newDistance;
                    }
                }
            }
            
            function handleTouchEnd(e) {
                if (e.touches.length === 0) {
                    isDragging = false;
                    initialDistance = 0;
                } else if (e.touches.length === 1) {
                    const touch = e.touches[0];
                    isDragging = true;
                    dragStartX = touch.clientX;
                    dragStartY = touch.clientY;
                    dragStartOffsetX = offsetX;
                    dragStartOffsetY = offsetY;
                    initialDistance = 0;
                }
            }
            
            function handleMouseDown(e) {
                e.preventDefault();
                isDragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                dragStartOffsetX = offsetX;
                dragStartOffsetY = offsetY;
                canvas.style.cursor = 'grabbing';
            }
            
            function handleMouseMove(e) {
                if (!isDragging) return;
                const dx = (e.clientX - dragStartX) / width * 2;
                const dy = (e.clientY - dragStartY) / height * 2;
                offsetX = dragStartOffsetX + dx;
                offsetY = dragStartOffsetY + dy;
                clampOffset();
            }
            
            function handleMouseUp() {
                isDragging = false;
                canvas.style.cursor = 'grab';
            }
            
            function handleWheel(e) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.93 : 1.07;
                let newZoom = zoom * delta;
                newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, newZoom));
                if (newZoom !== zoom) {
                    const rect = canvas.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    const nx = (mouseX / width) * 2 - 1;
                    const ny = (mouseY / height) * 2 - 1;
                    const worldX = (nx - offsetX) / zoom;
                    const worldY = (ny - offsetY) / zoom;
                    zoom = newZoom;
                    offsetX = nx - worldX * zoom;
                    offsetY = ny - worldY * zoom;
                    clampOffset();
                }
            }
            
            function resizeAndUpdate() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                clampOffset();
                draw();
            }
            
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd);
            canvas.addEventListener('touchcancel', handleTouchEnd);
            canvas.addEventListener('mousedown', handleMouseDown);
            window.addEventListener('mousemove', handleMouseMove);
            window.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('wheel', handleWheel, { passive: false });
            canvas.style.cursor = 'grab';
            
            window.addEventListener('resize', () => setTimeout(resizeAndUpdate, 80));
            resizeAndUpdate();
            animate();
        })();
    </script>
</body>
</html>
