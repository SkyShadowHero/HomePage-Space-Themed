<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="alternate" hreflang="en" href="https://skyshadow.fun/" />
    <link rel="alternate" hreflang="zh-CN" href="https://skyshadow.fun/zh-CN/" />
    <link rel="alternate" hreflang="x-default" href="https://skyshadow.fun/" />
    <link rel="canonical" href="https://skyshadow.fun/" />
    <link rel="icon" href="/favicon.png" type="/image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaving a digital footprint on the web | SkyShadowHero</title>
    <meta name="keywords" content="SkyShadowHero footprint">
    <meta name="description" content="Leaving a digital footprint on the web!">
    <meta name="author" content="SkyShadowHero">
    <link rel="stylesheet" href="/css/mycss.css">
    <script src="/js/tailwindcss.js"></script>
</head>
<body>
    <!-- loading canvas -->
    <div id="loading-mask" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-black transition duration-500 ease-in">
        <div id="footprints" class="flex flex-col items-center gap-4 relative" style="height: 180px;">
            <!-- footprint1 -->
            <svg class="footprint w-12 h-12 opacity-0 absolute right-0 bottom-0 -scale-x-100" aria-hidden="true" style="transition:opacity 0.25s;"><use xlink:href="#icon-footprint"></use></svg>
            <!-- footprint2 -->
            <svg class="footprint w-12 h-12 opacity-0 absolute left-0 bottom-[50px]" aria-hidden="true" style="transition:opacity 0.25s;"><use xlink:href="#icon-footprint"></use></svg>
            <!-- footprint3 -->
            <svg class="footprint w-12 h-12 opacity-0 absolute right-0 bottom-[100px] -scale-x-100" aria-hidden="true" style="transition:opacity 0.25s;"><use xlink:href="#icon-footprint"></use></svg>
        </div>
    </div>
    <script src="/js/load.js"></script>
    <script src="/js/jquery.min.js"></script>
    <script src="/iconfont/iconfont.js"></script>

    <div id="moon-bg" class="fixed bottom-0 left-0 w-screen h-44 bg-[url(/moon.webp)] bg-bottom bg-no-repeat bg-cover z-4 pointer-events-none">
    </div>
    <!-- earth canvas -->
    <canvas id="c" class="z-1"></canvas>
    
    <!-- Section 1: Hero -->
    <section class="snap-section" id="section1">
        <div class="scroll-down z-10">
            <svg class="icon w-8 h-8" aria-hidden="true">
                <use xlink:href="#icon-xiangxia"></use>
            </svg>
        </div>
    </section>
    
    <!-- Section 2: Profile -->
    <section class="snap-section z-2" id="section2">
        <div class="w-full h-full flex flex-col items-center justify-center text-white">
            <div class="max-w-9/10 container mx-auto flex flex-col items-center justify-center text-center">
                <img src="/avatar.webp" alt="avatar" class="duration-100 ease-in hover:scale-110 active:scale-110 w-48 rounded-full mb-4 shadow-lg/30">
                <div>
                    <p data-i18n="greeting" class="mb-4 md:mb-10 -rotate-y-4 rotate-z-346 hover:rotate-y-0 hover:rotate-z-0 hover:scale-110 active:rotate-y-0 active:rotate-z-0 active:scale-110 duration-500 text-2xl text-center text-shadow-lg/30">
                        I am SkyShadowHero
                    </p>
                    <p data-i18n="role" class="mb-4 md:mb-10 rotate-y-8 rotate-z-3 hover:rotate-y-0 hover:rotate-z-0 hover:scale-110 active:rotate-y-0 active:rotate-z-0 active:scale-110 duration-500 text-2xl text-center text-shadow-lg/30">
                        A Developer<br>in another world
                    </p>
                    <p data-i18n="bio" class="mb-4 md:mb-10 rotate-y-0 -rotate-z-3 hover:rotate-y-0 hover:rotate-z-0 hover:scale-110 active:rotate-y-0 active:rotate-z-0 active:scale-110 duration-500 text-lg text-center text-shadow-lg/30">
                        And a freshman majoring in Applied Chemistry at Central South University
                    </p>
                    <div class="mb-5 flex justify-center items-center space-x-4">
                        <a href="https://blog.skyshadow.fun" target="_blank" class="transition duration-300 hover:scale-150 hover:-translate-y-3 active:scale-150 active:-translate-y-3 ease-out">
                            <svg class="icon w-8 h-8" aria-hidden="true">
                                <use xlink:href="#icon-xieboke"></use>
                            </svg>
                        </a>
                        <a href="https://github.com/SkyShadowHero" target="_blank" class="transition duration-300 hover:scale-150 hover:-translate-y-3 active:scale-150 active:-translate-y-3 ease-out">
                            <svg class="icon w-8 h-8" aria-hidden="true">
                                <use xlink:href="#icon-github"></use>
                            </svg>
                        </a>
                        <a id="social-link-third" href="https://x.com/SkyShadowHero" target="_blank" class="transition duration-300 hover:scale-150 hover:-translate-y-3 active:scale-150 active:-translate-y-3 ease-out">
                            <svg class="icon w-8 h-8" aria-hidden="true">
                                <use id="social-icon-third" xlink:href="#icon-X"></use>
                            </svg>
                        </a>
                    </div>
                    <div class="mb-30 flex flex-wrap gap-2 items-center justify-center">
                        <div class="rotate-y-3 -rotate-z-350 hover:rotate-y-0 hover:rotate-z-0 hover:scale-110 active:rotate-y-0 active:rotate-z-0 active:scale-110 duration-300 bg-white px-3 py-1 rounded-full shadow-xs border border-gray-100">
                            <span class="font-medium text-gray-800">GODOT</span>
                        </div>
                        <div class="hover:scale-110 rotate-y-10 rotate-z-355 hover:rotate-y-0 hover:rotate-z-0 active:rotate-y-0 active:rotate-z-0 active:scale-110 duration-300 bg-white px-3 py-1 rounded-full shadow-xs border border-gray-100">
                            <span class="font-medium text-blue-600">PYTHON</span>
                        </div>
                        <div class="hover:scale-110 -rotate-y-8 -rotate-z-354 hover:rotate-y-0 hover:rotate-z-0 active:rotate-y-0 active:rotate-z-0 active:scale-110 duration-300 bg-white px-3 py-1 rounded-full shadow-xs border border-gray-100">
                            <span class="font-medium text-orange-500">VUE</span>
                        </div>
                        <div class="hover:scale-110 rotate-y-2 rotate-z-352 hover:rotate-y-0 hover:rotate-z-0 active:rotate-y-0 active:rotate-z-0 active:scale-110 duration-300 bg-white px-3 py-1 rounded-full shadow-xs border border-gray-100">
                            <span class="font-medium text-blue-400">COMPOSE</span>
                        </div>
                        <div class="hover:scale-110 rotate-y-6 rotate-z-354 hover:rotate-y-0 hover:rotate-z-0 active:rotate-y-0 active:rotate-z-0 active:scale-110 duration-300 bg-white px-3 py-1 rounded-full shadow-xs border border-gray-100">
                            <span class="font-medium text-cyan-500">TAILWIND</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <!-- Section 3: 我留下了一个脚印 -->
    <section class="snap-section" id="section3">
        <div class="w-full h-full flex flex-col items-center justify-center text-white">
            <div id="section3-text">
                <p data-i18n="footprint" class="hover:scale-110 -rotate-y-6 -rotate-z-4 hover:rotate-y-0 hover:rotate-z-0 active:rotate-y-0 active:rotate-z-0 active:scale-110 duration-300 text-2xl md:text-4xl text-center text-shadow-lg/30">
                    I left a digital footprint on the web!
                </p>
            </div>
        </div>
    </section>
    <!-- footer -->
    <footer class="z-5 fixed w-screen h-fit mx-auto mb-0">
        <div>
            <p>&copy;2022 - 2026 <span data-i18n="footerBy">By SkyShadowHero</span></p>
            <div class="text-center">
            <span data-i18n="frameLabel">Frame</span> 
            <a href="https://tailwindcss.com" target="_blank" class="cursor-pointer hover:underline active:underline">Tailwindcss</a> 
            | <span data-i18n="sourceLabel">Source</span> 
            <a href="https://github.com/SkyShadowHero/SkyShadowHero-Space-Themed-Website" target="_blank" class="cursor-pointer hover:underline active:underline">Github Repo</a>
            </div>
            <a href="https://icp.gov.moe/?keyword=20253014" target="_blank" class="cursor-pointer hover:underline active:underline"><span data-i18n="icpText">MoeICP20253014</span></a>
        </div>
    </footer>
    <script src="/js/stars.js"></script>
    <script src="/js/earth.js"></script>
    <script src="/js/myjs.js"></script>
    
    <div id="smooth-cursor" 
        class="fixed top-0 left-0 z-1 pointer-events-none transition-transform duration-300 ease-out" 
        style="--x: 50vw; --y: 50vh; --scale: 0; --rotate: 0deg; transform: translate(var(--x), var(--y)) translate(-50%, -50%) scale(var(--scale)) rotate(var(--rotate)); will-change: transform;">
        
        <svg class="w-8 h-8 text-black drop-shadow-md" aria-hidden="true">
            <use xlink:href="#icon-huojianjiasu"></use>
        </svg>
    </div>
    <div id="particle-container" class="fixed top-0 left-0 w-full h-full pointer-events-none z-1"></div>
    <script src="/js/rocket.js"></script>
    <!-- i18n.js 放在 body 末尾，确保所有 data-i18n 元素已解析 -->
    <script src="/js/i18n.js"></script>
</body>
</html>
